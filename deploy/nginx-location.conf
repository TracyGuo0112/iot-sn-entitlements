location = /sn-entitlements-demo {
    return 301 /sn-entitlements-demo/;
}

location ^~ /sn-entitlements-demo/ {
    alias /usr/share/nginx/html/sn-entitlements-demo/current/;
    index index.html;
    charset utf-8;
    add_header Cache-Control "no-cache";

    # Older Nginx MIME tables omit the ES modules used by this application.
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        image/jpeg jpg jpeg;
        image/svg+xml svg;
        text/csv csv;
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
    }
}
